<!doctype html>
<html lang="es"><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1280px; height: 520px; overflow: hidden; }
  body {
    position: relative;
    background: linear-gradient(160deg, #13251f 0%, #0b1513 55%, #070d0c 100%);
    font-family: "Segoe UI", system-ui, sans-serif; color: #e6f2ee;
  }
  .stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #e6fff5; }
  .left { position: absolute; left: 72px; top: 92px; width: 620px; }
  .logo { width: 132px; height: 132px; filter: drop-shadow(0 16px 30px rgba(0,0,0,.5)); }
  h1 { margin: 18px 0 0; font: 800 76px/1 "Cascadia Mono", Consolas, monospace; letter-spacing: -3px; }
  h1 b { color: #8fe3c0; }
  p { margin: 16px 0 0; font-size: 21px; line-height: 1.45; color: #a9c7bd; }
  .chips { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chips span { padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; color: #cfeee2; background: rgba(143,227,192,.1); border: 1px solid rgba(143,227,192,.25); }
  .shot {
    position: absolute; right: -40px; top: 66px; width: 720px;
    border-radius: 18px; overflow: hidden;
    transform: perspective(1400px) rotateY(-14deg) rotateX(4deg);
    box-shadow: 0 40px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(143,227,192,.18);
  }
  .shot img { display: block; width: 108%; margin: -2.4% 0 -6% -3.9%; }
</style></head><body>
  <div class="stars">
    <i style="left:60px;top:40px;opacity:.5"></i><i style="left:520px;top:470px;opacity:.35"></i>
    <i style="left:610px;top:120px;opacity:.4"></i><i style="left:1210px;top:30px;opacity:.5"></i><i style="left:430px;top:60px;opacity:.3"></i>
  </div>
  <div class="shot"><img src="../docs/screenshots/02-inicio.png" alt=""></div>
  <div class="left">
    <img class="logo" src="logo.png" alt="">
    <h1>Komori<b>.</b></h1>
    <p>Una islita en lo alto de tu pantalla,<br>cuidada por una mascota en 3D.</p>
    <div class="chips"><span>Música</span><span>Clima</span><span>Sistema</span><span>Notas</span><span>Chat IA</span><span>Claude Code</span></div>
  </div>
</body></html>
