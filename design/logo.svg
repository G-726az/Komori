<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Komori's logo: Bou, the little bun with a sprout, sitting on its island. Original artwork, MIT like the rest. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16312b"/>
      <stop offset="1" stop-color="#0a1311"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#8fe3c0" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#8fe3c0" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#8fe3c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bun" cx="0.36" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#eef9f4"/>
      <stop offset="1" stop-color="#b9dccd"/>
    </radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2522"/>
      <stop offset="1" stop-color="#070b0a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a4ecc9"/>
      <stop offset="1" stop-color="#5fbf95"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="40" y="40" width="944" height="944" rx="228" fill="url(#sky)"/>
  <rect x="40" y="40" width="944" height="944" rx="228" fill="url(#glow)"/>
  <rect x="41.5" y="41.5" width="941" height="941" rx="226.5" fill="none" stroke="#8fe3c0" stroke-opacity="0.14" stroke-width="3"/>
  <!-- A few stars -->
  <g fill="#e6fff5">
    <circle cx="214" cy="236" r="7" opacity="0.7"/>
    <circle cx="820" cy="250" r="5" opacity="0.55"/>
    <circle cx="300" cy="150" r="4" opacity="0.4"/>
    <circle cx="770" cy="380" r="4" opacity="0.45"/>
    <path d="M232 380 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6z" opacity="0.75"/>
  </g>

  <!-- The island, a slim pill with its clock, equalizer and dot -->
  <ellipse cx="512" cy="846" rx="260" ry="26" fill="#000" opacity="0.45" filter="url(#soft)"/>
  <rect x="262" y="754" width="500" height="86" rx="43" fill="url(#pill)"/>
  <rect x="264" y="756" width="496" height="82" rx="41" fill="none" stroke="#8fe3c0" stroke-opacity="0.55" stroke-width="4"/>
  <g fill="#8fe3c0">
    <rect x="316" y="786" width="11" height="28" rx="5.5"/>
    <rect x="336" y="778" width="11" height="36" rx="5.5"/>
    <rect x="356" y="790" width="11" height="24" rx="5.5"/>
    <circle cx="712" cy="798" r="10" opacity="0.9"/>
  </g>
  <rect x="604" y="787" width="66" height="22" rx="11" fill="#e6f2ee" opacity="0.85"/>

  <!-- Bou's shadow on the island -->
  <ellipse cx="512" cy="752" rx="230" ry="16" fill="#000" opacity="0.35" filter="url(#soft)"/>

  <!-- Bou: a soft bun -->
  <path d="M256 736 C 217 518 333 300 512 300 C 691 300 807 518 768 736 Q 512 764 256 736 Z" fill="url(#bun)"/>
  <ellipse cx="420" cy="410" rx="74" ry="38" fill="#ffffff" opacity="0.55" transform="rotate(-24 420 410)"/>

  <!-- The sprout -->
  <path d="M512 306 Q 525 252 552 230" fill="none" stroke="#5fbf95" stroke-width="28" stroke-linecap="round"/>
  <ellipse cx="584" cy="220" rx="44" ry="22" fill="url(#leaf)" transform="rotate(-28 584 220)"/>
  <path d="M556 232 Q 586 220 614 206" fill="none" stroke="#4aa47c" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- Face -->
  <ellipse cx="448" cy="560" rx="28" ry="33" fill="#2a2226"/>
  <ellipse cx="576" cy="560" rx="28" ry="33" fill="#2a2226"/>
  <circle cx="438" cy="546" r="10" fill="#fff"/>
  <circle cx="566" cy="546" r="10" fill="#fff"/>
  <ellipse cx="388" cy="620" rx="36" ry="21" fill="#ff809c" opacity="0.45"/>
  <ellipse cx="636" cy="620" rx="36" ry="21" fill="#ff809c" opacity="0.45"/>
  <path d="M494 612 Q 512 628 530 612" fill="none" stroke="#2a2226" stroke-width="8" stroke-linecap="round"/>
</svg>
