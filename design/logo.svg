<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Komori's logo: a little bat (kōmori) perched on its island. Original artwork, MIT like the rest. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16312b"/>
      <stop offset="1" stop-color="#0a1311"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#8fe3c0" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#8fe3c0" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#8fe3c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fur" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#d9fff0"/>
      <stop offset="0.45" stop-color="#9eeccb"/>
      <stop offset="1" stop-color="#4fb98f"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fc79d"/>
      <stop offset="1" stop-color="#2f8466"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2522"/>
      <stop offset="1" stop-color="#070b0a"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#3a3340"/>
      <stop offset="1" stop-color="#120f15"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="40" y="40" width="944" height="944" rx="228" fill="url(#sky)"/>
  <rect x="40" y="40" width="944" height="944" rx="228" fill="url(#glow)"/>
  <rect x="41.5" y="41.5" width="941" height="941" rx="226.5" fill="none" stroke="#8fe3c0" stroke-opacity="0.14" stroke-width="3"/>
  <!-- A few stars -->
  <g fill="#e6fff5">
    <circle cx="214" cy="236" r="7" opacity="0.7"/>
    <circle cx="820" cy="210" r="5" opacity="0.55"/>
    <circle cx="300" cy="150" r="4" opacity="0.4"/>
    <circle cx="760" cy="330" r="4" opacity="0.45"/>
    <path d="M846 300 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z" opacity="0.8"/>
  </g>

  <!-- The island, a pill with its tiny clock and equalizer -->
  <ellipse cx="512" cy="812" rx="270" ry="30" fill="#000" opacity="0.45" filter="url(#soft)"/>
  <rect x="252" y="700" width="520" height="104" rx="52" fill="url(#pill)"/>
  <rect x="254" y="702" width="516" height="100" rx="50" fill="none" stroke="#8fe3c0" stroke-opacity="0.55" stroke-width="4"/>
  <g fill="#8fe3c0">
    <rect x="312" y="736" width="12" height="34" rx="6"/>
    <rect x="334" y="726" width="12" height="44" rx="6"/>
    <rect x="356" y="742" width="12" height="28" rx="6"/>
    <circle cx="712" cy="752" r="11" opacity="0.9"/>
  </g>
  <g fill="#e6f2ee" opacity="0.85">
    <rect x="600" y="740" width="70" height="24" rx="12"/>
  </g>

  <!-- Wings -->
  <path d="M378 520 C 300 430 200 410 128 450 C 168 486 170 540 150 586 C 196 566 236 580 256 618 C 284 588 326 590 352 616 Z" fill="url(#wing)"/>
  <path d="M646 520 C 724 430 824 410 896 450 C 856 486 854 540 874 586 C 828 566 788 580 768 618 C 740 588 698 590 672 616 Z" fill="url(#wing)"/>
  <!-- Wing bones -->
  <g fill="none" stroke="#2a7a5d" stroke-width="7" stroke-linecap="round" opacity="0.6">
    <path d="M360 528 C 300 500 230 470 160 458"/>
    <path d="M360 548 C 320 560 290 580 256 610"/>
    <path d="M664 528 C 724 500 794 470 864 458"/>
    <path d="M664 548 C 704 560 734 580 768 610"/>
  </g>

  <!-- Ears -->
  <path d="M372 400 C 352 320 360 250 384 214 C 430 250 466 300 482 344 Z" fill="url(#fur)"/>
  <path d="M652 400 C 672 320 664 250 640 214 C 594 250 558 300 542 344 Z" fill="url(#fur)"/>
  <path d="M392 372 C 384 320 388 280 398 258 C 424 284 444 312 456 340 Z" fill="#ffb8cc" opacity="0.85"/>
  <path d="M632 372 C 640 320 636 280 626 258 C 600 284 580 312 568 340 Z" fill="#ffb8cc" opacity="0.85"/>

  <!-- Body: a round soft bun sitting on the island -->
  <ellipse cx="512" cy="540" rx="200" ry="186" fill="url(#fur)"/>
  <ellipse cx="452" cy="440" rx="70" ry="38" fill="#ffffff" opacity="0.35" transform="rotate(-18 452 440)"/>

  <!-- Feet holding on to the pill -->
  <ellipse cx="456" cy="706" rx="38" ry="22" fill="#4fb98f"/>
  <ellipse cx="568" cy="706" rx="38" ry="22" fill="#4fb98f"/>

  <!-- Face -->
  <ellipse cx="438" cy="528" rx="40" ry="48" fill="url(#eye)"/>
  <ellipse cx="586" cy="528" rx="40" ry="48" fill="url(#eye)"/>
  <circle cx="424" cy="510" r="15" fill="#fff"/>
  <circle cx="572" cy="510" r="15" fill="#fff"/>
  <circle cx="450" cy="548" r="7" fill="#fff" opacity="0.8"/>
  <circle cx="598" cy="548" r="7" fill="#fff" opacity="0.8"/>
  <ellipse cx="380" cy="588" rx="34" ry="20" fill="#ff8fb0" opacity="0.55"/>
  <ellipse cx="644" cy="588" rx="34" ry="20" fill="#ff8fb0" opacity="0.55"/>
  <path d="M486 596 Q 512 618 538 596" fill="none" stroke="#1e2b27" stroke-width="9" stroke-linecap="round"/>
  <path d="M492 600 L 499 624 L 506 603 Z" fill="#ffffff"/>
  <path d="M532 600 L 525 624 L 518 603 Z" fill="#ffffff"/>
</svg>
