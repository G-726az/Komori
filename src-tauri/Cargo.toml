[package]
name = "komori"
version = "0.2.0"
description = "Komori — a little island at the top of your screen"
authors = ["Komori contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "komori_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }
base64 = "0.22"
png = "0.17"
tauri-plugin-dialog = "2"
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
wv2-core = { package = "windows-core", version = "0.62" }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_WinRT",
  "Win32_System_Com",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security_Credentials",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Foundation",
  "Media_Control",
  "Storage_Streams",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
